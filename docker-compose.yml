services:
  mysql:
    image: mysql:8.4
    container_name: gnss-tambang-mysql
    environment:
      MYSQL_DATABASE: gnss_tambang
      MYSQL_USER: gnss
      MYSQL_PASSWORD: gnss
      MYSQL_ROOT_PASSWORD: gnss_root
    ports:
      - "3306:3306"
    volumes:
      - gnss-tambang-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ugnss -pgnss --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  gnss-tambang-mysql-data:
